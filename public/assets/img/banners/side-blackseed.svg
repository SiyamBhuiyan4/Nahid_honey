    <text x="120" y="312" text-anchor="middle" font-size="48" font-weight="800" fill="#2A1608">HONEY</text>
    <g fill="#2A1608"><ellipse cx="96" cy="342" rx="6" ry="3"/><ellipse cx="112" cy="346" rx="6" ry="3"/><ellipse cx="128" cy="342" rx="6" ry="3"/><ellipse cx="144" cy="346" rx="6" ry="3"/></g>
  </g>

  <!-- copy -->
  <text x="60" y="110" font-size="22" font-weight="700" fill="#7A3A10" letter-spacing="3">NEW ARRIVAL</text>
  <text x="60" y="180" font-size="62" font-weight="800" fill="#2A1608" letter-spacing="-1">Black Seed</text>
  <text x="60" y="248" font-size="62" font-weight="800" fill="#2A1608" letter-spacing="-1">Honey</text>
