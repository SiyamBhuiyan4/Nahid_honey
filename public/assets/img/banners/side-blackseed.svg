<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE2A8"/><stop offset=".55" stop-color="#F7A74A"/><stop offset="1" stop-color="#9A4A1E"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF8DC"/><stop offset=".4" stop-color="#FFE59A" stop-opacity=".9"/><stop offset="1" stop-color="#FFE59A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A1608"/><stop offset=".45" stop-color="#5A2E0E"/><stop offset="1" stop-color="#1E0F05"/>
    </linearGradient>
  </defs>
  <rect width="860" height="700" fill="url(#sky)"/>
  <circle cx="600" cy="380" r="260" fill="url(#sun)"/>
  <path d="M0 520c120-60 240-80 360-50s260 10 500-60v290H0z" fill="#6B3A1A" opacity=".55"/>
  <path d="M0 580c160-40 320-40 480-10s260 0 380-30v160H0z" fill="#3E2210"/>
  <g fill="#2E1A0A"><path d="M90 590c4-40 8-60 0-90M100 520c-20-10-30-4-40 6M98 545c20-14 34-10 44 0"/></g>
  <path d="M90 590c4-40 8-60 0-90" stroke="#2E1A0A" stroke-width="4" fill="none"/>

