  <g transform="translate(120 0)">
    <rect x="0" y="150" width="250" height="46" rx="23" fill="#fff" opacity=".85"/>
    <text x="125" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#D9731A" letter-spacing="3">100% NATURAL</text>
    <text x="0" y="300" font-size="96" font-weight="800" fill="#0F2A28" letter-spacing="-2">Pure Raw</text>
    <text x="0" y="400" font-size="96" font-weight="800" fill="#0F2A28" letter-spacing="-2">Honey</text>
    <text x="0" y="460" font-size="28" font-weight="500" fill="#5B3A14">Straight from the hive to your home</text>
    <rect x="0" y="510" width="230" height="66" rx="12" fill="#F28C28"/>
    <text x="115" y="552" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">SHOP NOW →</text>
