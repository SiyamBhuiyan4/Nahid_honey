    <text x="120" y="296" text-anchor="middle" font-size="46" font-weight="800" fill="#3B2410">HONEY</text>
    <text x="120" y="330" text-anchor="middle" font-size="16" font-weight="500" fill="#7A4A1E" letter-spacing="2">RAW · NATURAL</text>
    <path d="M30 96c-4 40-4 60 6 70" stroke="#fff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round" fill="none"/>
