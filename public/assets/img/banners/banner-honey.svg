<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 700" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="70%" cy="40%" r="80%">
      <stop offset="0" stop-color="#FFF1C9"/>
      <stop offset=".55" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F7A93A"/>
    </radialGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#D9780F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8763A"/><stop offset="1" stop-color="#8A5122"/>
    </linearGradient>
    <pattern id="hex" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M30 0l30 17v35L30 69 0 52V17zM30 69l30 17v35M30 69L0 86v35" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1760" height="700" fill="url(#bg)"/>
  <g opacity=".5"><g transform="translate(1230 330)" fill="#FFF7DD" opacity=".55">
    <path d="M0 0L-900-500h160z"/><path d="M0 0L-600 520h-180z"/><path d="M0 0L600-520h180z"/><path d="M0 0L900 300v-160z"/><path d="M0 0L-950 60v-140z"/>
  </g></g>
  <rect x="980" y="0" width="780" height="700" fill="url(#hex)"/>
  <circle cx="1230" cy="380" r="270" fill="#FFF6DA" opacity=".8"/>
  <circle cx="1230" cy="380" r="330" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-dasharray="4 14"/>

