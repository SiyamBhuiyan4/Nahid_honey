      <path d="M68 78l28 16v32l-28 16-28-16V94z"/><path d="M124 78l28 16v32l-28 16-28-16V94z"/><path d="M180 78l28 16v32l-28 16-28-16V94z"/>
    </g>
    <path d="M60 150c0 20 6 34 6 44s-12 10-12 0 6-24 6-44z" fill="#E08A10"/>
  </g>

