  </g>

  <!-- dipper -->
  <g transform="rotate(-28 1250 150)">
    <rect x="1240" y="-60" width="22" height="260" rx="11" fill="url(#wood)"/>
    <g fill="#C9873F" stroke="#8A5122" stroke-width="3">
      <ellipse cx="1251" cy="210" rx="44" ry="16"/><ellipse cx="1251" cy="240" rx="50" ry="18"/><ellipse cx="1251" cy="270" rx="44" ry="16"/>
    </g>
  </g>
  <path d="M1318 300c-6 40 2 60-2 110" stroke="#F2A21A" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- bees -->
  <g id="bee" transform="translate(1520 180)">
    <ellipse cx="-10" cy="-16" rx="18" ry="12" fill="#fff" opacity=".85" transform="rotate(-25 -10 -16)"/>
    <ellipse cx="10" cy="-16" rx="18" ry="12" fill="#fff" opacity=".85" transform="rotate(25 10 -16)"/>
    <ellipse cx="0" cy="0" rx="26" ry="18" fill="#FFC21A" stroke="#3B2410" stroke-width="3"/>
