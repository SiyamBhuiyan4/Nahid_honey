<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 700" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF3E2"/><stop offset=".5" stop-color="#FFE4C2"/><stop offset="1" stop-color="#FFC98A"/>
    </linearGradient>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A800"/><stop offset=".4" stop-color="#FFD43B"/><stop offset="1" stop-color="#C98A00"/>
    </linearGradient>
    <linearGradient id="ghee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A3"/><stop offset="1" stop-color="#F2C24E"/>
    </linearGradient>
    <linearGradient id="hny" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB524"/><stop offset="1" stop-color="#C8650A"/>
    </linearGradient>
  </defs>
  <rect width="1760" height="700" fill="url(#bg)"/>
  <circle cx="1250" cy="360" r="300" fill="#fff" opacity=".55"/>
  <circle cx="1250" cy="360" r="220" fill="#fff" opacity=".5"/>
  <rect x="900" y="560" width="760" height="20" rx="10" fill="#E9B57A" opacity=".5"/>

  <!-- mustard oil bottle -->
  <g transform="translate(980 110)">
    <rect x="70" y="0" width="60" height="40" rx="8" fill="#C0392B"/>
    <path d="M78 40h44v40c40 20 70 50 70 100v260c0 20-16 34-36 34H44c-20 0-36-14-36-34V180c0-50 30-80 70-100z" fill="url(#oil)"/>
    <path d="M30 180c-6 80-6 180 0 260" stroke="#fff" stroke-opacity=".5" stroke-width="12" stroke-linecap="round"/>
    <rect x="18" y="240" width="164" height="140" rx="10" fill="#fff"/>
    <path d="M100 260c-14 18-22 30-22 42a22 22 0 0 0 44 0c0-12-8-24-22-42z" fill="#F2B705"/>
    <text x="100" y="345" text-anchor="middle" font-size="24" font-weight="800" fill="#1F5E2E">MUSTARD</text>
    <text x="100" y="368" text-anchor="middle" font-size="16" font-weight="600" fill="#7A6A20" letter-spacing="3">OIL</text>
  </g>

  <!-- ghee jar -->
  <g transform="translate(1210 280)">
    <rect x="0" y="0" width="190" height="40" rx="10" fill="#1F5E2E"/>
    <path d="M-6 40h202v200c0 26-20 44-46 44H40c-26 0-46-18-46-44z" fill="url(#ghee)"/>
    <rect x="10" y="100" width="170" height="100" rx="10" fill="#fff"/>
    <text x="95" y="160" text-anchor="middle" font-size="38" font-weight="800" fill="#1F5E2E">GHEE</text>
    <text x="95" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#9A7A20" letter-spacing="3">PURE COW</text>
    <path d="M14 60c-4 50-4 120 0 160" stroke="#fff" stroke-opacity=".6" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- honey jar -->
  <g transform="translate(1440 250)">
    <rect x="10" y="0" width="150" height="34" rx="10" fill="#6B3E18"/>
    <path d="M0 34h170c14 0 24 10 24 24v220c0 22-18 38-40 38H16c-22 0-40-16-40-38V58c0-14 10-24 24-24z" fill="url(#hny)"/>
    <rect x="-8" y="120" width="186" height="100" rx="10" fill="#FFF6E2"/>
    <text x="85" y="180" text-anchor="middle" font-size="36" font-weight="800" fill="#3B2410">HONEY</text>
    <path d="M10 50c-4 60-4 140 0 200" stroke="#fff" stroke-opacity=".55" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- tag -->
  <g transform="translate(1520 110) rotate(10)">
    <circle r="78" fill="#E5392F"/>
    <circle r="66" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 6"/>
    <text y="-8" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">SAVE</text>
    <text y="30" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">MORE</text>
  </g>

  <!-- copy -->
  <g transform="translate(120 0)">
    <rect x="0" y="150" width="230" height="46" rx="23" fill="#0F2A28"/>
    <text x="115" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#F6B40E" letter-spacing="3">OFFER ZONE</text>
    <text x="0" y="300" font-size="92" font-weight="800" fill="#0F2A28" letter-spacing="-2">Combo Deals</text>
    <text x="0" y="398" font-size="92" font-weight="800" fill="#F28C28" letter-spacing="-2">Save More</text>
    <text x="0" y="458" font-size="28" font-weight="500" fill="#6B4A2A">Honey, ghee &amp; oil — better together</text>
    <rect x="0" y="510" width="230" height="66" rx="12" fill="#F28C28"/>
    <text x="115" y="552" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" letter-spacing="1">SHOP NOW →</text>
  </g>
</svg>
